<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Popup</title>
  <link rel="stylesheet" href="popup.css" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
  <div class="popup-container">
    <!-- Login Section -->
    <div id="login-section" class="section hidden">
      <h2>👋 Welcome to <div style="display: flex; align-items: center;gap: 10px;">
           <img src="../images/feedora.png" style="height: 50px;" />
        <div>
          <h1  style="font-size: xx-large;">Feedora</h1>
        </div> 
      </div>
      </h2>
      <p>Please log in to use the extension.</p>
      <a class="button primary" href="../frontend/index.html" target="_blank">Login / Sign Up</a>
    </div>

    <!-- Logged-in Section -->
    <div id="main-ui" class="section hidden">
      
      <div style="display: flex; align-items: center;gap: 10px;">
           <img src="../images/feedora.png" style="height: 50px;" />
        <div>
          <h1  style="font-size: xx-large;">Feedora</h1>
        </div> 
      </div>
      <h2 class="username">
        Hi, <span id="username" style="color: rgb(216, 100, 100); font-family: 'URW Chancery L', cursive;">user</span>!
      </h2>

      <a class="button secondary" href="../frontend/index.html" target="_blank">Dashboard</a>
      <div class="switch-wrapper" title="Disable content tracking while this is ON">
        <label class="switch">
          <input type="checkbox" id="checkNativeSwitch" >>
          <span class="slider"></span>
        </label>
          <label class="switch-label" for="checkNativeSwitch">Go incognito</label>
      </div>

      
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
