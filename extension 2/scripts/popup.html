<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Popup</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="popup-container">
    <!-- Login Section -->
    <div id="login-section" class="section hidden">
      <h1>👋 Welcome!</h1>
      <p>Please log in to use the extension.</p>
      <a class="button primary" href="../frontend/index.html" target="_blank">Login / Sign Up</a>
    </div>

    <!-- Logged-in Section -->
    <div id="main-ui" class="section hidden">
      <h1>📡 Watch Me Surf</h1>
      <h3><p class="username">Hi, <span id="username">user</span>!</p></h3>

      <a class="button secondary" href="../frontend/index.html" target="_blank">Dashboard</a>
      <div class="switch-wrapper">
        <label class="switch">
          <input type="checkbox" id="checkNativeSwitch">
          <span class="slider"></span>
        </label>
        <label class="switch-label" for="checkNativeSwitch">Go incognito</label>
      </div>

      
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
